<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Lovecats</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background-image: url("Wallpaper2.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-family: 'Invite', sans-serif;
        }
        
        .pagina {
            width: 90%;
            max-width: 700px;
            text-align: center;
            padding: 40px 20px;
        }

        .imagem-principal {
            width: min(60vw, 400px);
            height: min(60vw, 400px);
            object-fit: cover;
            display: block;
            margin: 0 auto;
            border-radius: 4px;
        }

        .texto {
            margin-top: 30px;
            color: black;
            font-size: 22px;
            line-height: 1.6;
        }

        audio {
            display: none;
        }

        .hidden {
            display: none;
            color: yellow;
        }
    </style>
</head>

<body>

    <main class="pagina">

        <img
            class="imagem-principal"
            src="2110426.png"
            alt="Imagem principal"
        >

        <p class="texto">
        Palavra de 3 Palavras
          1. Jogue
          3. https://docs.google.com/document/d/1r9P8vsUWImx1Jd1q1YxmHYcGT-OKy98JdrOuNur8bL8/edit?usp=drivesdk
        </p>

        <audio id="musica" autoplay loop>
            <source src="The Lovecats.mp3" type="audio/mpeg">
        </audio>

    </main>
    
    <span class="hidden"> eu estou na sua lata! </span>
        
    <script>
        const musica = document.getElementById("musica");

        musica.volume = 1.0;

        function iniciarMusica() {
            musica.play().catch(() => {});
        }

        iniciarMusica();

        document.addEventListener("click", iniciarMusica, { once: true });
        document.addEventListener("touchstart", iniciarMusica, { once: true });
        document.addEventListener("keydown", iniciarMusica, { once: true });
    </script>

</body>
</html>
